name: Publish prepared v0.14.1 alpha

on:
  push:
    paths:
      - .github/workflows/bootstrap-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore prepared source
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d | tar -x
          rm .github/workflows/bootstrap-release.yml
      - name: Verify and build
        shell: bash
        run: |
          npm ci
          npm test
          npm audit --omit=dev --audit-level=high
          npm run build
          cd dist
          sha256sum -c SHA256SUMS
      - name: Commit source and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish v0.14.1 alpha source"
          git tag -a v0.14.1 -m "HiveTalk OBS Bridge v0.14.1 alpha"
          git push origin main
          git push origin v0.14.1
          gh release create v0.14.1 \
            dist/hivetalk-obs-bridge-v0.14.1.zip \
            dist/hivetalk-obs-bridge-firefox-v0.14.1.xpi \
            dist/SHA256SUMS \
            --title "HiveTalk OBS Bridge v0.14.1 alpha" \
            --notes "First public alpha. Four independent live participant slots are working in initial testing. Camera-off participant selection is supported, but the OBS placeholder image is a known issue. Audio pairing and sustained four-feed load still need broader validation. See README.md and KNOWN_ISSUES.md before use."

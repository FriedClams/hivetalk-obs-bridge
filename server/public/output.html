<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}video{width:100%;height:100%;object-fit:contain}.placeholder{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#10151f;color:#fff;font-family:system-ui,sans-serif}.placeholder[hidden],video[hidden]{display:none}.avatar,.initials{width:min(38vw,276px);height:min(38vw,276px);border-radius:50%;object-fit:cover}.initials{display:flex;align-items:center;justify-content:center;background:#43516a;font-size:min(15vw,112px);font-weight:700}.name{max-width:85%;margin-top:34px;font-size:min(5.2vw,42px);font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.camera-off{margin-top:10px;color:#aeb7c8;font-size:min(3.5vw,28px)}.status{position:fixed;inset:auto 12px 12px 12px;padding:8px;background:#111d;color:#fff;font:14px system-ui;white-space:pre-wrap}
</style></head><body><video id="media" autoplay playsinline></video><div id="placeholder" class="placeholder" hidden><img id="avatar" class="avatar" alt="" hidden><div id="initials" class="initials"></div><div id="participant-name" class="name"></div><div class="camera-off">Camera off</div></div><div id="status" class="status">Starting local bridge…</div><script src="/output.js"></script></body></html>
